<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Aura Coffee & Bakehouse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container d-flex justify-content-center">
      <a class="navbar-brand m-0" href="index.html">Aura Coffee & Bakehouse</a>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="card auth-card shadow">
      <h2 class="text-center mb-4">Create Account</h2>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="regName" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="regPassword" required minlength="6">
            <button class="btn btn-outline-secondary d-flex align-items-center" type="button" id="toggleRegPassword" style="border-color: #444; background-color: #2a2a2a; color: #aaa;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="regSubmit">Register</button>
        <p class="text-center text-muted small mb-0">Already have an account? <a href="login.html" class="text-primary text-decoration-none">Sign in</a></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmit');
      
      btn.disabled = true;
      btn.textContent = 'Registering...';
      
      const { data, error } = await supabaseClient.auth.signUp({
        email, 
        password,
        options: {
          data: {
            full_name: name
          }
        }
      });
      
      if (error) {
        showToast('Registration Failed', error.message, true);
        btn.disabled = false;
        btn.textContent = 'Register';
        return;
      }
      
      if (data && data.user && data.user.identities && data.user.identities.length > 0) {
        // Insert into profiles
        const { error: profileError } = await supabaseClient
          .from('profiles')
          .insert([{ id: data.user.id, full_name: name, role: 'customer' }]);
          
        if (profileError) {
          console.error('Profile creation error:', profileError);
        }
        
        window.location.href = 'index.html';
      } else {
        showToast('Notice', 'Check your email for a confirmation link, or this email is already registered.', false);
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });

    document.getElementById('toggleRegPassword').addEventListener('click', function (e) {
      const passwordInput = document.getElementById('regPassword');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    });
  </script>
</body>
</html>
